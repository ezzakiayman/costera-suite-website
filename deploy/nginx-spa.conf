# The live Costera website is mounted at /home/.
# Add this inside the Nginx server block for costerasuite.com.
location = /home/industries { try_files /home/index.html =404; }
location = /home/industries/ { try_files /home/index.html =404; }
location ^~ /home/ {
    try_files $uri $uri/ /home/index.html;
}
